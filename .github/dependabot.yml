# The site ships no JavaScript dependencies, so the only thing worth watching
# is the actions the workflows pin. A stale action is how a supply chain gets
# in, and nobody notices on a project that builds green every week.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # The default is five, and there were exactly five actions to update, so
    # two more sat queued behind the cap with nothing on screen saying so.
    open-pull-requests-limit: 10
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
