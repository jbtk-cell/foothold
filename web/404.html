<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not here - Foothold</title>
<meta name="robots" content="noindex">
<!--
  GitHub Pages serves this for any path it does not have. The course itself
  routes on the hash, so a stale or mistyped link lands here rather than in
  the app, and the useful thing to do is send them back to the course instead
  of leaving them on GitHub's grey octocat.
-->
<meta http-equiv="refresh" content="3; url=./">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #101a26;
    color: #e6ecf1;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    text-align: center;
    padding: 24px;
  }
  h1 { font-size: 26px; margin: 0 0 10px; font-weight: 600; }
  p { color: #90a3b4; margin: 0 0 22px; line-height: 1.6; }
  a {
    display: inline-block;
    padding: 10px 18px;
    border-radius: 6px;
    background: #ff5c39;
    color: #0b131d;
    font-weight: 600;
    text-decoration: none;
  }
</style>
</head>
<body>
  <main>
    <h1>There is nothing at this address</h1>
    <p>The course is one page, and this is not it.<br>Taking you back in a moment.</p>
    <a href="./">Go to the course</a>
  </main>
</body>
</html>
