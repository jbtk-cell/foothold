<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Foothold - learn Python in your browser</title>
<meta name="description" content="A free, open source course that teaches you to code, with a real Python interpreter running inside the page. No account, no install, nothing sent to a server.">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0F1620">

<!-- Social previews. The image is absolute because Open Graph requires it;
     regenerate it with `node tools/make_social_card.mjs` if the brand or the
     lesson count changes. -->
<meta property="og:title" content="Foothold - watch your code run">
<meta property="og:description" content="A free Python course with a step-through debugger in every exercise. Real CPython in your browser. No account, no install, works offline.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Foothold">
<meta property="og:url" content="https://jbtk-cell.github.io/foothold/">
<meta property="og:image" content="https://jbtk-cell.github.io/foothold/assets/social.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A Python program mid-execution, with the running line highlighted and a variable caught changing.">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Foothold - watch your code run">
<meta name="twitter:description" content="A free Python course with a step-through debugger in every exercise.">
<meta name="twitter:image" content="https://jbtk-cell.github.io/foothold/assets/social.png">

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/app.css">
</head>
<body data-route="home">

<a class="skip-link" href="#view">Skip to content</a>

<header class="topbar">
  <button id="nav-toggle" class="icon-btn nav-only" aria-label="Show the course list">
    <span class="bars" aria-hidden="true"></span>
  </button>

  <a class="brand" href="#/">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 21 L9 6 L13 13 L16 9 L22 21 Z"/>
        <circle cx="9" cy="6" r="1.8" fill="currentColor" stroke="none"/>
      </svg>
    </span>
    <span class="brand-word">Foothold</span>
  </a>

  <div class="topbar-right">
    <span id="runtime-status" class="runtime-status" data-kind="idle">Python not started</span>
    <button id="theme-toggle" class="icon-btn" aria-label="Switch between dark and light">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"
           stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4.2"/>
        <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/>
      </svg>
    </button>
    <a class="icon-btn" href="https://github.com/jbtk-cell/foothold" target="_blank" rel="noopener noreferrer"
       aria-label="Foothold on GitHub">
      <svg viewBox="0 0 16 16" width="18" height="18" fill="currentColor" aria-hidden="true">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
      </svg>
    </a>
  </div>
</header>

<div class="shell">
  <aside id="nav" class="sidebar" aria-label="Course contents"></aside>
  <div class="nav-scrim" aria-hidden="true"></div>
  <main id="view" class="view" tabindex="-1"></main>
</div>

<noscript>
  <div class="error-page">
    <h1>Foothold needs JavaScript</h1>
    <p>The whole course - including the Python interpreter - runs inside your
       browser, so there is nothing to show without it.</p>
  </div>
</noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>
